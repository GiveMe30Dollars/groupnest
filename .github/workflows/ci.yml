name: Rust Crate CI

on:
  push:
    branches:
      - "master"
      - "main"
  pull_request:
    branches:
      - "master"
      - "main"

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: ${{ vars.CARGO_BUILD_WARNINGS || 'warn' }}

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        toolchain:
          - stable
          - beta
          - nightly

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets
  
  fmt:
    name: Cargo Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Check formatting
        run: cargo fmt --all -- --check
  
  semver:
    name: Semver Check
    if: ${{ vars.SEMVER_CHECKS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Use cargo-semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@v2

      - name: Check semver compatibility
        run: cargo semver-checks check-release

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"
        run: cargo +nightly doc --no-deps --all-features

      - name: Test documentation
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"
        run: cargo +nightly test --doc --all-features

  readme:
    name: README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-readme
        run: cargo install cargo-readme

      - name: Generate README
        run: cargo readme --input src/README.rustdoc.md --output README.generated.md --no-comment-extraction

      - name: Check README
        run: git diff --exit-code -- README.md

  publish-dry-run:
    name: Publish Dry Run
    if: ${{ vars.SEMVER_CHECKS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check dry run
        run: cargo publish --dry-run