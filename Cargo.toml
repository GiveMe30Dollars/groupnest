[package]
name = "groupnest"
version = "0.1.0"
edition = "2024"

[dependencies]
by_address = "1.2.1"
derive_more = {version = "2.1.1", features = ["as_ref", "from", "into"]}
expect-test = "1.5.1"
id-arena = "2.3.0"
termcolor = {version = "1.4.1", optional = true}
thiserror = "2.0.19"
typed-arena = "2.0.2"
unicode-width = "0.2.2"

[features]
termcolor = ["dep:termcolor"]

[lints.clippy]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
